<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 BGM</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="minihome">
    <header class="titlebar">
      <h1>♫ 오늘의 BGM</h1>
      <p>내 하루에 어울리는 노래를 모아 둔 미니홈피</p>
    </header>

    <div class="layout">
      <aside class="panel">
        <p class="label">MY PROFILE</p>
        <div class="avatar" aria-hidden="true">🎧</div>
        <h2>음악수집가</h2>
        <p>이어폰 꽂고 집에 가는 시간을 좋아해요.</p>
      </aside>

      <section class="panel">
        <p class="label">PLAYLIST 01</p>
        <h2>새벽에 듣는 노래</h2>
        <ol class="tracks">
          <li>
            <a href="https://www.youtube.com/results?search_query=IU+Through+the+Night">
              밤편지 · 아이유 ↗
            </a>
            <p>불을 끄고 하루를 마무리할 때.</p>
          </li>
          <li>
            <a href="https://www.youtube.com/results?search_query=The+Black+Skirts+Everything">
              Everything · 검정치마 ↗
            </a>
            <p>늦은 밤 버스 창밖을 볼 때.</p>
          </li>
        </ol>
      </section>
    </div>
  </main>
</body>
</html>
