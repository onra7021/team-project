
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>플레이리스트 감상 | four:wave</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="site">

  <header class="header">
    <a href="index.html" class="logo">
      <span class="logo-icon">♫</span> four:wave
    </a>

    <nav>
      <a href="index.html">홈으로</a>
      <a href="quiz.html">취향 테스트</a>
      <a href="#more-playlists">다른 플레이리스트</a>
    </nav>
  </header>

  <main>
    <section class="section detail-page">
      <span class="eyebrow">OUR PLAYLIST</span>

      <h1>플레이리스트 감상</h1>

      <p class="section-desc">
      우리의 취향을 담아 고른 플레이리스트를 감상해보세요. 
      </p>

      <div id="playlist-content"></div>
    </section>

    <section class="section other-section" id="more-playlists">
      <span class="eyebrow">KEEP LISTENING</span>

      <h2>이런 음악도 들어보세요</h2>

      <p class="section-desc">
        다른 팀원이 만든 플레이리스트도 살펴보세요.
      </p>

      <div class="playlist-grid" id="more-grid"></div>
    </section>

    <div class="center-actions bottom-actions">
      <a href="index.html" class="secondary-btn">
        ← 메인페이지로 돌아가기
      </a>

      <a href="quiz.html" class="primary-btn">
        음악 취향 테스트하기
      </a>
    </div>
  </main>

  <footer>
    FOUR CURATORS · MANY MOODS · ONE SOUND SPACE
  </footer>

</div>

<script src="data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const playlistId = params.get("id");

  if (!playlistId || !APP.playlists[playlistId]) {
    document.getElementById("playlist-content").innerHTML = `
      <div class="empty-state">
        <h2>플레이리스트를 찾을 수 없어요.</h2>
        <a href="index.html" class="primary-btn">
          메인페이지로 이동 →
        </a>
      </div>
    `;
  } else {
    APP.renderPlaylist(
      document.getElementById("playlist-content"),
      playlistId
    );
  }

  // 다른 플레이리스트는 항상 볼 수 있도록 표시
  APP.renderCards(
    document.getElementById("more-grid"),
    APP.playlists[playlistId] ? playlistId : null
  );
</script>
</body>
</html>
